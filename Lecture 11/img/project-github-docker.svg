<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Share a project through GitHub and run it with Docker</title>
<desc id="desc">Students prepare project files and push them to GitHub. A teammate clones the files, builds a Docker image locally and runs a container that prints a confusion matrix.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#38718d" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="390" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="115" y="30" text-anchor="middle" font-size="22" fill="#40576a">Students</text>
<text x="355" y="30" text-anchor="middle" font-size="22" fill="#40576a">GitHub</text>
<text x="835" y="30" text-anchor="middle" font-size="22" fill="#40576a">Teammate’s computer</text>
<path d="M490 47H1180" stroke="#92b9cb" stroke-width="2"/>
<rect x="10" y="85" width="210" height="220" rx="12" fill="#edf6fb" stroke="#38718d" stroke-width="2"/><text x="115" y="125" text-anchor="middle" font-size="23" font-weight="bold" fill="#163f57">1. Project</text><text x="115" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1c655e">Prepare files</text><text x="115" y="212" dy="0" text-anchor="middle" font-size="18" fill="#273540">Code + saved model</text><text x="115" y="212" dy="29" text-anchor="middle" font-size="18" fill="#273540">Test data + packages</text><text x="115" y="212" dy="58" text-anchor="middle" font-size="18" fill="#273540">Dockerfile + README</text><path d="M224 190H247" stroke="#38718d" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="85" width="210" height="220" rx="12" fill="#edf6fb" stroke="#38718d" stroke-width="2"/><text x="355" y="125" text-anchor="middle" font-size="23" font-weight="bold" fill="#163f57">2. Repository</text><text x="355" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1c655e">git push</text><text x="355" y="212" dy="0" text-anchor="middle" font-size="18" fill="#273540">Share the files</text><text x="355" y="212" dy="29" text-anchor="middle" font-size="18" fill="#273540">and instructions</text><path d="M464 190H487" stroke="#38718d" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="85" width="210" height="220" rx="12" fill="#eaf5f0" stroke="#38718d" stroke-width="2"/><text x="595" y="125" text-anchor="middle" font-size="23" font-weight="bold" fill="#163f57">3. Local copy</text><text x="595" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1c655e">git clone</text><text x="595" y="212" dy="0" text-anchor="middle" font-size="18" fill="#273540">Download the project</text><text x="595" y="212" dy="29" text-anchor="middle" font-size="18" fill="#273540">into a new folder</text><path d="M704 190H727" stroke="#38718d" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="85" width="210" height="220" rx="12" fill="#eaf5f0" stroke="#38718d" stroke-width="2"/><text x="835" y="125" text-anchor="middle" font-size="23" font-weight="bold" fill="#163f57">4. Docker image</text><text x="835" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1c655e">docker build</text><text x="835" y="212" dy="0" text-anchor="middle" font-size="18" fill="#273540">Package Python,</text><text x="835" y="212" dy="29" text-anchor="middle" font-size="18" fill="#273540">dependencies and files</text><path d="M944 190H967" stroke="#38718d" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="85" width="210" height="220" rx="12" fill="#eaf5f0" stroke="#38718d" stroke-width="2"/><text x="1075" y="125" text-anchor="middle" font-size="23" font-weight="bold" fill="#163f57">5. Container</text><text x="1075" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1c655e">docker run</text><text x="1075" y="212" dy="0" text-anchor="middle" font-size="18" fill="#273540">Run the saved model</text><text x="1075" y="212" dy="29" text-anchor="middle" font-size="18" fill="#273540">Print confusion matrix</text><text x="600" y="355" text-anchor="middle" font-size="22" fill="#40576a">The teammate builds and runs locally, then compares the output with the README.</text></g></svg>